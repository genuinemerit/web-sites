# Localization catalog: es-ES (Iberian Spanish) for comunidad. Reviewed
# and approved by David, 2026-10-04, no changes. Informal "tú", as on
# the other sites.
#
# Naming: "Sandwich Open Mic" stays as the event's proper name; the
# generic idea is "micro abierto". Sandwich Arts Alliance, First Church
# UCC and "Elvis Church" are proper names, kept (the last one glossed).
# Alt texts use gender-neutral forms (artista, cantante, guitarrista,
# flautista) where English is neutral.

