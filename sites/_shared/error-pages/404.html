<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>404 — The Abyss</title>
  <link rel="stylesheet" href="/shared/tokens.css">

  <style>
    :root {
      --background: #030405;
      --text: #f1f1ed;
      --muted: #b8b9b5;
      --accent: #d7d8d2;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;

      font-size: 1.125rem;

      background:
        radial-gradient(
          ellipse at 50% 48%,
          #000 0%,
          #000 16%,
          #080a0c 17%,
          #11151a 19%,
          #050607 23%,
          #020303 40%,
          var(--background) 75%
        );
    }

    main {
      width: min(100%, 42rem);
      padding: 3rem 2.5rem;

      background:
        radial-gradient(
          ellipse at center,
          rgb(0 0 0 / 0.18),
          rgb(0 0 0 / 0.58)
        );

      text-align: center;
    }

    .error-code {
      margin: 0 0 1rem;

      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 18ch;
      margin: 0 auto 1.5rem;

      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    p {
      max-width: 34rem;
      margin: 0 auto 1.25rem;
    }

    .signoff {
      margin-top: 2.5rem;
      color: var(--muted);
    }

    @media (max-width: 35rem) {
      body {
        padding: 1rem;
      }

      main {
        padding: 2rem 1rem;
      }
    }
  </style>
</head>

<body>
  <main>
    <p class="error-code">404 · Page not found</p>

    <h1>The abyss is looking back at you.</h1>

    <p>
      Sorry, the page you are looking for is currently unavailable.<br>
      Please try again later.
    </p>

    <p class="signoff">
      <em>Faithfully yours, The Admin.</em>
    </p>
  </main>
</body>
</html>
