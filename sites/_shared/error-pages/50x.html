<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Server Error — Lost in Space</title>
  <link rel="stylesheet" href="/shared/tokens.css">

  <style>
    :root {
      --background: #fafaf7;
      --text: #252525;
      --muted: #66645f;
      --rule: #deddd7;
    }

    body {
      padding: 2rem;
      font-size: 1.0625rem;
    }

    main {
      width: min(100%, 70rem);
      min-height: calc(100vh - 4rem);
      margin: 0 auto;

      display: grid;
      grid-template-columns: minmax(18rem, 0.8fr) minmax(24rem, 1.2fr);
      align-items: center;
      gap: clamp(2rem, 6vw, 6rem);
    }

    .message {
      max-width: 34rem;
    }

    .error-code {
      margin: 0 0 1rem;

      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 1.5rem;

      font-size: clamp(2rem, 5vw, 3.25rem);
      line-height: 1.1;
      letter-spacing: -0.025em;
    }

    p {
      margin: 0 0 1.25rem;
    }

    .admin-note {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--rule);

      color: var(--muted);
      font-size: 0.95rem;
    }

    .signoff {
      margin-top: 2rem;
      color: var(--muted);
    }

    figure {
      margin: 0;
    }

    figure img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 80vh;
      object-fit: contain;
    }

    @media (max-width: 48rem) {
      body {
        padding: 1.25rem;
      }

      main {
        min-height: auto;
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      .message {
        padding-top: 2rem;
      }

      figure {
        order: -1;
        max-width: 30rem;
        margin: 0 auto;
      }

      figure img {
        max-height: 55vh;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="message">
      <p class="error-code">50x · Server error</p>

      <h1>An error occurred.</h1>

      <p>
        Sorry, the page you are looking for is currently lost in space.<br>
        Please try again later.
      </p>

      <p class="admin-note">
        If you are the system administrator of this resource, check the
        error log for details.
      </p>

      <p class="signoff">
        <em>Faithfully yours, gmerit.</em>
      </p>
    </section>

    <figure>
      <img
        src="little_prince.jpg"
        alt="The Little Prince being carried through space by a flock of birds"
      >
    </figure>
  </main>
</body>
</html>
