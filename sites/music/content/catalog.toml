# Music workbench catalog - the content of music.davidstitt.net/workbench/.
# Edit this file to change the site; the build turns it into one page per
# piece, in English and (from es-ES translations) Spanish.
# Format guide: https://toml.io - strings in "quotes", lists in [brackets].
#
# Converted 2026-10-10 from the prototype's catalog.json
# (heirloom/music-workbench-refined-v2/). The prototype's working note,
# kept here as a comment: "Progress and checklist are new working fields,
# not claims about historical completion. Descriptions are drawn from the
# legacy site where possible; some titles and categories are inferred
# from filenames."

# Pieces shown as tiles on the workbench welcome page, in this order.
featured = ["woodshed", "bella", "king-phillip"]

# Checklist used by any piece that doesn't define its own.
default_checklist = ["Listen / review existing material", "Decide on the next step"]

# ---------------------------------------------------------------------
# Vocabulary: the words pieces are tagged with. Left: the key used in
# pieces below; right: the English label shown on the site. Order here is
# display order. Add a word here before using it on a piece.
# ---------------------------------------------------------------------

[vocabulary.kind]
song = "Song"
arrangement = "Arrangement"
arrangement-backing-track = "Arrangement / backing track"
backing-track-experiment = "Backing-track experiment"
original-composition = "Original composition"
improvisation = "Improvisation"
guitar-study = "Guitar study"
sound-experiment = "Sound experiment"
practice-plan = "Practice plan"

[vocabulary.activity]
composition = "Composition"
performance = "Performance"
repertoire = "Repertoire"
practice = "Practice"

[vocabulary.instrument]
voice = "Voice"
guitar = "Guitar"
piano = "Piano"
percussion = "Percussion"
daw-mix = "DAW/Mix"
ai = "AI"
other = "Other"

[vocabulary.genre]
lessons = "Lessons"
trad-folk = "Trad/Folk"
pop-rock = "Pop/Rock"
musicals-broadway = "Musicals/Broadway"
other = "Other"

[vocabulary.status]
not-started = "Not started"
learning = "Learning"
in-progress = "In progress"
developing = "Developing"
ready = "Ready"
on-hold = "On hold"
archived = "Archived"

[vocabulary.type]
audio = "Audio"
video = "Video"
link = "Link"

# ---------------------------------------------------------------------
# Pieces. Required: id (used in the page address), title, kind, activity,
# instrument, genre, summary, at least one resource.
# Optional: subtitle, status (default "not-started"), checklist (default
# above), resources_heading / checklist_heading (defaults "Recording &
# sources" / "Next steps").
#
# Resources: either  file = "name.mp3"  (a recording hosted on this site,
# in sites/music/media/ - audio or video from the extension) or
# url = "https://..." with  type = "video" / "link"  (somewhere else).
# date is "YYYY-MM" (or "YYYY"), optional.
# ---------------------------------------------------------------------

