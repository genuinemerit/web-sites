# Spanish (es-ES) translation of catalog.toml - the music workbench
# content. Same shape as the English file; only translated text lives
# here. Drafted by Claude, reviewed and approved by David 2026-10-10.
#
# Each block's `source` is a fingerprint of the English it was
# translated from. When the English changes, the build stops with
# "out of date" for that block: update the Spanish, then record the new
# fingerprint shown by
#     poetry run python -m websites.music.check --status
#
# Titles of works stay as they are (a piece may add `title = "..."` to
# translate a descriptive one). Iberian Spanish; musical terms as used in
# Spain (toma = take, pista de acompañamiento = backing track, punteo =
# fingerpicking).

