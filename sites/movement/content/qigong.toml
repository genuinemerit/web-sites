# Qigong catalog (design/movement.md): the categories, the exercise sets
# in each, and the background references - in page order. The index
# page, its counts, the sidebar and the category menu are built from
# this file. Checked by websites.movement.catalog.
#
# Every id becomes a page address, /<locale>/qigong/<id>/, so ids are
# unique lowercase slugs across sets AND references. Where a set has both
# a Chinese (romanized) and an English name, the id is the Chinese one,
# e.g. wuqinxi for the Five Animal Frolics (David, 2026-10-15). A set or reference
# appears as a link only once its page exists
# (sites/movement/content/<locale>/qigong/<id>.md, design step 3).
#
#   category   id, title, subtitle, image (file in static/img/), alt
#              ("" = decorative, as in the prototype)
#   set        id, category, title, summary ("" = none), source (the prototype PDF
#              it comes from, heirloom/qigong/sets/ - for the record)
#   reference  id, title, summary, source (heirloom/qigong/img/)
#
# Titles and summaries from David's prototype (heirloom/qigong/).

