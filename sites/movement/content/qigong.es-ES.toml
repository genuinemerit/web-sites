# Spanish (es-ES) translation of qigong.toml - the qigong catalog's
# titles, summaries and category text (design/movement.md, step 4).
# Drafted by Claude, reviewed and approved by David 2026-10-15. Iberian
# Spanish, "tú".
#
# Each block's `source` is a fingerprint of the English it was
# translated from. When the English changes, the check stops with "out
# of date" for that block: update the Spanish, then record the new
