---
# Shared variables for the web-sites droplet. Much smaller than sask's
# equivalent — no live app service (Frozen-Flask means static output only,
# nginx serves it directly), so no app_user/app_group/gunicorn/Caddy
# machinery is needed here.

# --- connection -------------------------------------------------------
# bootstrap.yml overrides remote_user to root for its one-time run; every
# other play connects as admin_user.
ansible_user: "{{ admin_user }}"
admin_user: dave
ssh_public_key_path: "~/.ssh/ws_ed25519.pub"

# --- platform maintenance ----------------------------------------------
apt_upgrade: false
apt_cache_valid_time: 3600

# --- journald (general system hygiene, not tied to any running app) -----
journald_system_max_use: 200M
journald_max_retention: 14day

# --- nginx (platform-level hardening only at this stage — no per-site
# vhosts here yet; those get added by later, separate "new site bring-up"
# tooling once a site's Frozen-Flask build actually exists, see
# planning/architecture.md's Deploy/ops tooling section) --------------
nginx_server_tokens: "off"
