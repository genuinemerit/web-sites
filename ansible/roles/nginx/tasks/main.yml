---
# No sask equivalent to adapt from (sask uses Caddy for its single app;
# web-sites uses nginx + certbot - design/certificates.md, option A).
# Platform level only: hardening, TLS settings, and the default servers.
# Per-site vhosts and certificates are roles/sites.

- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

# legacy/nginx-review.md: "server_tokens build" leaks the nginx
# version/build tag. The stock Ubuntu config's own comment says to turn
# it off; this does that.
- name: Disable server_tokens (version/build disclosure)
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: "^\\s*server_tokens\\s"
    line: "\tserver_tokens {{ nginx_server_tokens }};"
    validate: "nginx -t -c %s"
  notify: Reload nginx

# Ubuntu 26.04's stock nginx.conf already sets both of these the way
# the Mozilla intermediate profile wants (tls.conf.j2 explains why they
# can't simply be redefined there). Enforced, not assumed, so a future
# package default can't quietly re-enable old protocols.
- name: Enforce TLS protocol settings in nginx.conf
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    validate: "nginx -t -c %s"
  loop:
    - { regexp: "^\\s*ssl_protocols\\s", line: "\tssl_protocols TLSv1.2 TLSv1.3;" }
    - { regexp: "^\\s*ssl_prefer_server_ciphers\\s", line: "\tssl_prefer_server_ciphers off;" }
  notify: Reload nginx

- name: Install the security-headers snippet
  ansible.builtin.template:
    src: security-headers.conf.j2
    dest: /etc/nginx/snippets/security-headers.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

# Also covers the port-80 catch-all's own responses.
- name: Include the security-headers snippet from the http block
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    insertafter: "^http \\{"
    line: "\tinclude /etc/nginx/snippets/security-headers.conf;"
    validate: "nginx -t -c %s"
  notify: Reload nginx

- name: Install the TLS settings
  ansible.builtin.template:
    src: tls.conf.j2
    dest: /etc/nginx/conf.d/tls.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Create the shared ACME challenge directory
  ansible.builtin.file:
    path: "{{ acme_webroot }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the default servers (ACME + HTTPS redirect, unknown-host reject)
  ansible.builtin.template:
    src: 00-default.conf.j2
    dest: /etc/nginx/sites-available/00-default.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable the default servers
  ansible.builtin.file:
    src: /etc/nginx/sites-available/00-default.conf
    dest: /etc/nginx/sites-enabled/00-default.conf
    state: link
  notify: Reload nginx

# Ubuntu's stock "Welcome to nginx" site also claims default_server on
# port 80 - two defaults is a config error, and it shouldn't be public.
- name: Remove the stock default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

# Whole-config test before any reload: on failure the play stops here
# and the running nginx keeps serving its previous, working config.
- name: Test the full nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Apply nginx changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
