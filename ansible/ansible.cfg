[defaults]
inventory = inventory.yml
# host_key_checking deliberately left at Ansible's default (True). sask
# sets it False, which makes Ansible pass StrictHostKeyChecking=no to
# ssh - silently overriding the alias's own `accept-new` (written by
# infra/tofu/ssh-config.tf into ~/.ssh/config.d/ubuvm_ws) and accepting a *changed* host key, i.e. a
# possible man-in-the-middle. Left at the default, ssh honours
# accept-new: a fresh droplet's key is trusted on first contact (destroy/
# recreate purge the stale entry first), a changed one is refused.
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
# Deliberately no ssh_args/-F override: relies on the main ~/.ssh/config's
# `Include ~/.ssh/config.d/*` to resolve the web-sites-droplet alias. An
# explicit `-F ~/.ssh/config.d/ubuvm_ws` here would silently fail — `~`
# isn't shell-expanded when Ansible invokes the ssh subprocess directly
# (same gotcha documented in sask's ansible.cfg).
pipelining = True
